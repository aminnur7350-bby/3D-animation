<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Animation</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background">
        <div class="cube">
            <div class="face front">3D</div>
            <div class="face back">CODE</div>
            <div class="face right">WEB</div>
            <div class="face left">AI</div>
            <div class="face top">HTML</div>
            <div class="face bottom">CSS</div>
        </div>
    </div>

    <div class="content">
        <h1>Welcome to 3D World</h1>
        <p>Interactive 3D Animation Website</p>

        <button id="changeBtn">Change Animation</button>
        <button id="stopBtn">Stop Animation</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
